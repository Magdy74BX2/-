
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة النتائج ولجنة الرأفة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light">

<div class="container py-4">
    <h2 class="text-center mb-4 fw-bold">نظام إدارة النتائج ولجنة الرأفة</h2>

    <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

    <div class="row g-4">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header fw-bold">إدخال بيانات الطالب</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="studentName" class="form-label">اسم الطالب</label>
                        <input type="text" id="studentName" class="form-control" placeholder="أدخل اسم الطالب">
                    </div>

                    <div class="mb-3">
                        <label for="grade1" class="form-label">درجة المادة الأولى</label>
                        <input type="number" id="grade1" class="form-control" placeholder="0 - 100">
                    </div>

                    <div class="mb-3">
                        <label for="grade2" class="form-label">درجة المادة الثانية</label>
                        <input type="number" id="grade2" class="form-control" placeholder="0 - 100">
                    </div>

                    <div class="mb-3">
                        <label for="grade3" class="form-label">درجة المادة الثالثة</label>
                        <input type="number" id="grade3" class="form-control" placeholder="0 - 100">
                    </div>

                    <div class="mb-3">
                        <label for="attendance" class="form-label">نسبة الحضور (%)</label>
                        <input type="number" id="attendance" class="form-control" placeholder="0 - 100">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="button" id="addStudentBtn" class="btn btn-primary">إضافة طالب</button>
                        <button type="button" id="mercyBtn" class="btn btn-warning">تفعيل لجنة الرأفة</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm mb-4">
                <div class="card-header fw-bold">الطلاب المضافون</div>
                <div class="card-body" id="studentsListBox"></div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header fw-bold">التقرير النهائي للجنة الرأفة</div>
                <div class="card-body" id="reportBox"></div>
            </div>
        </div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
